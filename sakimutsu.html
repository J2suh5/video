<script>
(() => {
'use strict';
// =====================================================================
//  AUDIO — an original score, synthesized in the browser (WebAudio)
//  72 BPM, 4/4, 72 bars = 240 s.  D major → B minor → D minor → E major
// =====================================================================
const BPM = 72, BEAT = 60 / BPM, BAR = BEAT * 4;
const tb = (bar, beat = 0) => (bar * 4 + beat) * BEAT;
const NIX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function nm(s) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(s);
  if (!m) throw new Error('bad note ' + s);
  return NIX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const pcOf = s => (NIX[s[0]] + (s[1] === '#' ? 1 : s[1] === 'b' ? -1 : 0) + 12) % 12;
const QUAL = {
  '': [0, 4, 7], 'm': [0, 3, 7], '7': [0, 4, 7, 10], 'm7': [0, 3, 7, 10], 'maj7': [0, 4, 7, 11],
  'sus4': [0, 5, 7], 'sus2': [0, 2, 7], 'add9': [0, 4, 7, 14], 'dim': [0, 3, 6], 'maj9': [0, 4, 7, 11, 14],
};
function chord(sym) {
  const [main, sl] = sym.split('/');
  const m = /^([A-G][#b]?)(.*)$/.exec(main);
  const root = pcOf(m[1]), iv = QUAL[m[2]];
  if (!iv) throw new Error('chord ' + sym);
  return { root, bass: sl ? pcOf(sl) : root, pcs: iv.map(i => (root + i) % 12) };
}
const trc = (c, n) => ({ root: (c.root + n + 120) % 12, bass: (c.bass + n + 120) % 12, pcs: c.pcs.map(p => (p + n + 120) % 12) });
const upTo = (pc, lo) => { let m = lo; while (((m % 12) + 12) % 12 !== pc) m++; return m; };

function vLH(c) {             // spread left-hand voicing, 5 notes
  const b = upTo(c.bass, 38);
  const fifth = (c.root + 7) % 12;
  const n1 = upTo(fifth, b + 3), n2 = upTo(c.root, n1 + 1), n3 = upTo(c.pcs[1], n2 + 1);
  const n4 = upTo(c.pcs.length > 3 ? c.pcs[3] : fifth, n3 + 1);
  return [b, n1, n2, n3, n4];
}
function vPad(c, lo = 52) { return c.pcs.slice(0, 4).map(pc => upTo(pc, lo)).sort((a, b) => a - b); }
function vGtr(c) {
  const b = upTo(c.bass, 40); const out = [b]; let cur = b;
  for (const pc of [(c.root + 7) % 12, c.root, c.pcs[1], (c.root + 7) % 12, c.root]) { cur = upTo(pc, cur + 3); out.push(cur); }
  return out;
}
function seq(str) {           // "A4:1 D5:.5 r:1 | ..." → notes with beat offsets
  const out = []; let b = 0;
  for (const tok of str.split(/\s+/)) {
    if (!tok || tok === '|') continue;
    const [n, d] = tok.split(':'); const dur = parseFloat(d);
    if (n !== 'r') for (const x of n.split('+')) out.push({ o: b, m: nm(x), d: dur });
    b += dur;
  }
  return out;
}

// ---- themes ----
const THEME_A = 'A4:1 D5:1 E5:1 F#5:1 | E5:2 C#5:1 A4:1 | D5:1 C#5:.5 D5:.5 F#5:1.5 E5:.5 | D5:3 B4:1 | G4:1 B4:1 E5:1 D5:.5 E5:.5 | F#5:1.5 E5:.5 C#5:1 A4:1 | B4:1 D5:1 G5:1.5 F#5:.5 | E5:2 D5:2';
const THEME_A4 = 'A4:1 D5:1 E5:1 F#5:1 | E5:2 C#5:1 A4:1 | D5:1 C#5:.5 D5:.5 F#5:1.5 E5:.5 | D5:3 B4:1';
const CH_A = [['D'], ['A/C#'], ['Bm'], ['G'], ['Em7'], ['A'], ['Bm7', 'G'], ['A', 'D']];
const THEME_B = 'B5:1.5 A5:.5 G5:1 F#5:1 | E5:1.5 F#5:.5 A5:2 | A5:1 F#5:1 C#5:1 E5:1 | D5:3 B4:1 | G5:1.5 F#5:.5 E5:1 B4:1 | C#5:1 E5:1 G5:1 A5:1 | F#5:2 E5:1 D5:1 | D5:4';
const CH_B = [['G'], ['A'], ['F#m'], ['Bm'], ['Em'], ['A7'], ['D'], ['D']];
const CODETTA = 'D6:.5 B5:.5 G5:.5 B5:.5 D6:1 r:1 | C#6:.5 A5:.5 E5:.5 A5:.5 C#6:1 r:1 | A5:.5 C#6:.5 F#5:1 B5:.5 D6:.5 F#6:1 | E6:1 D6:.5 B5:.5 C#6:1 A5:1';
const CH_COD = [['G'], ['A'], ['F#m', 'Bm'], ['Em', 'A7']];
const RAIN_MEL = 'F#5:2 D5:1 B4:1 | D5:3 r:1 | A4:1 D5:1 F#5:1 E5:1 | E5:2 C#5:1 r:1 | F#5:1.5 E5:.5 D5:1 B4:1 | G5:2 F#5:1 D5:1 | E5:2 G5:1 F#5:1 | F#5:2 E5:1 C#5:1 | B5:2 A5:1 F#5:1 | G5:2 D5:2 | E5:1 F#5:1 G5:1 E5:1 | F#5:4';
const CH_RAIN = [['Bm'], ['G'], ['D'], ['A'], ['Bm'], ['G'], ['Em'], ['F#7'], ['Bm'], ['G'], ['Em'], ['F#']];
const MASK_MEL = 'D5:1.5 E5:.5 F5:1 A5:1 | Bb5:2 A5:1 F5:1 | G5:1.5 F5:.5 E5:1 D5:1 | C#5:3 A4:1 | D5:1 F5:1 A5:1 D6:1 | D6:1.5 C6:.5 Bb5:1 A5:1 | G5:1 Bb5:1 A5:1 C#6:1 | A5:2 E5:1 C#5:1';
const CH_MASK = [['Dm'], ['Bb'], ['Gm'], ['A'], ['Dm'], ['Bb'], ['Gm', 'A'], ['A7']];

function buildScore() {
  const E = [];
  let seed = 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const hum = (v, a = .08) => Math.max(.03, v * (1 + (rnd() - .5) * a));
  const ev = (t, d, i, m, v, x) => E.push({ t: Math.max(0, t), d, i, m, v, x });
  const mel = (bar, str, i, tr = 0, v = .6, leg = 1) => { for (const n of seq(str)) ev(tb(bar, n.o) + (rnd() - .5) * .012, n.d * BEAT * leg, i, n.m + tr, hum(v)); };
  const each = (bar, list, tr, fn) => list.forEach((syms, k) => {
    const per = 4 / syms.length;
    syms.forEach((s, j) => fn(trc(chord(s), tr), tb(bar + k, j * per), per * BEAT, bar + k, j));
  });
  const arp8 = (c, t, d, v = .3) => {
    const n = vLH(c), pat = [0, 1, 2, 3, 4, 3, 2, 1], steps = Math.round(d / (BEAT / 2));
    for (let k = 0; k < steps; k++) { const tt = t + k * BEAT / 2; ev(tt, t + d - tt + .2, 'pno', n[pat[k % 8]], hum(v * (k % 4 === 0 ? 1.15 : .95))); }
  };
  const pad = (c, t, d, v = .15, lo = 52, x = {}) => ev(t, d, 'str', 0, v, Object.assign({ notes: vPad(c, lo) }, x));
  const gpick = (c, t, d, v = .25) => {
    const n = vGtr(c), pat = [0, 2, 3, 4, 1, 3, 4, 5], steps = Math.round(d / (BEAT / 2));
    for (let k = 0; k < steps; k++) ev(t + k * BEAT / 2, 1.8, 'gtr', n[pat[k % 8] % n.length], hum(v * (k % 2 ? .82 : 1)));
  };
  const strum = (c, t, d, v = .25) => {
    const n = vGtr(c);
    for (const [b, dir, acc] of [[0, 1, 1], [1, 1, .8], [1.5, -1, .55], [2.5, -1, .6], [3, 1, .8], [3.5, -1, .55]]) {
      if (b * BEAT >= d - 1e-3) continue;
      const ns = dir > 0 ? n : [...n].reverse().slice(0, 4);
      ns.forEach((m, k) => ev(t + b * BEAT + k * .012, 1.3, 'gtr', m, hum(v * acc * (dir > 0 ? 1 : .8))));
    }
  };
  const bassL = (c, t, d, v = .45) => {

      }
      case 'crickets': { const g = c.createGain(); const stop = this.env(g, when, v, off > 0 ? 1 : 3, e.d - off - 2, 2); g.connect(this.bus.amb); const s = this.noiseSrc(this.cricket, when, true, off); s.connect(g); s.stop(stop); break; }

      }
    }
  }
}

const GLSL_COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform vec3 uView; uniform vec3 uCam;
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
vec3 h32(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yzz)*p3.zyx); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);

const mat2 RM = mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vn(p); p=RM*p+vec2(3.1,7.7); a*=.5; } return s/.97; }

float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h11(i),h11(i+1.),f); }
float ridge(float x, float s){ return n1(x+s)*.55 + n1(x*2.13+s*1.7)*.27 + n1(x*4.37+s*2.9)*.13 + n1(x*9.1+s)*.05; }

const VS_FS = `#version 300 es

// ---------------------------------------------------------------- scene backgrounds
const FS_BG = GLSL_COMMON + `
in vec2 vUv; out vec4 o;

float pxs(){ return 1.3/uView.z; }
float cover(float d){ return smoothstep(-pxs(), pxs(), d); }

vec3 scPrologue(vec2 p, float t){

// ── 3 stage

    float m3=mod(fi,3.);
    vec3 bc=m3<.5? vec3(.45,.62,1.) : (m3<1.5? vec3(.5,1.,.72) : vec3(1.,.6,.82));
    float pulse=.7+.3*pow(.5+.5*cos(beat*6.2832+fi*.7),3.);
    col+=bc*bm*hz*.5*on*pulse;
  }
  float fl=cover(p.y-862.);
  vec3 floorc=vec3(.035,.028,.045)+vec3(.15,.12,.25)*exp(-abs(p.y-862.)/40.)*on;
  floorc+=vec3(.3,.25,.5)*exp(-pow((p.x-960.)/500.,2.))*exp(-(p.y-862.)/90.)*.25*on;
  col=mix(col, floorc, fl);
  return col;
}
// ── 4 rain
vec3 rainSky(vec2 p, float t){
  float y=p.y/1080.;
  vec3 col=mix(vec3(.02,.03,.06), vec3(.08,.1,.14), smoothstep(0.,.75,y));
  vec2 cp=par(p,.05);
  col+=vec3(.17,.12,.11)*fbm(vec2(cp.x/500.+t*.01, cp.y/160.))*smoothstep(.0,.7,y)*.6;
  col+=vec3(.5,.55,.8)*uP1.x*smoothstep(.75,.0,y)*fbm3(cp/300.);
  vec2 b1=par(p,.25);
  float bx=floor(b1.x/90.); float h1=520.-260.*pow(h11(bx*3.7),1.5);
  vec3 bc=vec3(.035,.045,.07);
  vec2 wc=vec2(b1.x/14., b1.y/18.); vec2 wi=floor(wc), wf=fract(wc);
  float lit=step(.72,h12(wi+bx*7.))*step(.2,wf.x)*step(wf.x,.7)*step(.25,wf.y)*step(wf.y,.75);
  vec3 wcol=mix(vec3(1.,.75,.45), vec3(.7,.85,1.), step(.8,h12(wi+3.)));
  bc+=wcol*lit*.33*(.8+.2*sin(t*3.+h12(wi)*50.));
  col=mix(col, bc, cover(b1.y-h1));
  vec2 b2=par(p,.45);
  float bx2=floor(b2.x/150.); float h2=600.-200.*pow(h11(bx2*5.1+2.),1.3);
  vec3 b2c=vec3(.02,.025,.04);
  vec2 wc2=vec2(b2.x/20., b2.y/26.); vec2 wi2=floor(wc2), wf2=fract(wc2);
  float lit2=step(.78,h12(wi2+bx2*11.))*step(.2,wf2.x)*step(wf2.x,.75)*step(.2,wf2.y)*step(wf2.y,.7);
  b2c+=vec3(1.,.72,.4)*lit2*.45;
  col=mix(col, b2c, cover(b2.y-h2));
  vec2 bk=par(p,.6);
  for(int i=0;i<2;i++){
    float cs=i==0?110.:170.;
    vec2 g=floor(bk/cs), f=fract(bk/cs);
    vec2 c=.25+.5*h22(g+float(i)*17.);
    float r=(.2+.16*h12(g+4.))*cs*.5;
    float dd=length((f-c)*cs);
    float disc=smoothstep(r,r*.85,dd)*(.55+.45*smoothstep(r*.5,r,dd));
    vec3 kc=mix(vec3(1.,.6,.3), vec3(.4,.7,1.), h12(g+9.));
    kc=mix(kc, vec3(1.,.3,.35), step(.86,h12(g+1.)));
    float show=step(.45,h12(g+20.))*smoothstep(420.,680.,bk.y)*smoothstep(860.,760.,bk.y);
    col+=kc*disc*show*.2;
  }
  return col;
}
vec3 scRain(vec2 p, float t){
  float hor=805.; vec2 lamp=uP0.xy; float on=uP0.z;
  vec3 col;
  if(p.y<hor) col=rainSky(p,t);
  else {
    float k=p.y-hor;
    vec2 q=vec2(p.x+(vn(vec2(p.x/40., p.y/6.-t*2.))-.5)*18.*smoothstep(0.,200.,k), hor-k);
    col=rainSky(q,t)*.3;
    col=mix(col, vec3(.03,.035,.05), .4);
    vec2 rp=vec2(p.x, (p.y-hor)*3.2);
    vec2 g=floor(rp/62.), f=fract(rp/62.)-.5;
    float ph=fract(t*.9+h12(g));
    float rr=length(f)*62.;
    float ring=exp(-pow((rr-ph*28.)/2.,2.))*(1.-ph)*step(.35,h12(g+3.));
    col+=vec3(.4,.45,.55)*ring*.28;
    col+=vec3(.06,.07,.1)*smoothstep(1080.,hor,p.y)*.5;
  }
  vec2 v=p-lamp;
  if(v.y>0.){ float w=30.+v.y*.43; float cone=exp(-pow(v.x/w,2.)*1.4)*exp(-v.y/950.)*smoothstep(0.,40.,v.y);
    float hz=.55+.45*fbm3(vec2(p.x/90., p.y/70.-t*.3));
    col+=vec3(1.,.82,.55)*cone*hz*.36*on; }
  float pool=exp(-pow((p.x-lamp.x)/240.,2.)-pow((p.y-910.)/48.,2.));
  col+=vec3(1.,.8,.52)*pool*.38*step(hor,p.y)*on;
  col+=vec3(1.,.85,.6)*exp(-length(v)/42.)*.55*on;
  col+=vec3(.55,.6,.85)*uP1.x*.35;
  return col;
}
// ── 5 masquerade: rose window
vec3 scMask(vec2 p, float t){
  vec2 c=uP0.xy; float R=uP0.z;
  vec3 col=mix(vec3(.05,.0,.014), vec3(.006,0.,.004), smoothstep(150.,1000.,p.y));
  col+=vec3(.2,.02,.05)*exp(-length(p-c)/680.)*.9;
  vec2 v=p-c; float r=length(v); float a=atan(v.y,v.x);
  float N=12., seg=6.2831853/N;
  float fa=mod(a+seg*.5, seg)-seg*.5;
  vec2 fp=vec2(cos(fa),sin(fa))*r;
  if(r<R+8.){
    float tr=abs(r-R*.2);
    tr=min(tr, abs(r-R*.52)); tr=min(tr, abs(r-R));
    if(r>R*.2) tr=min(tr, abs(fp.y));
    tr=min(tr, abs(length(fp-vec2(R*.76,0.))-R*.19));
    tr=min(tr, abs(length(fp-vec2(R*.36,0.))-R*.1));
    tr=min(tr, abs(length(fp-vec2(R*.76,0.))-R*.06));
    float line=1.-smoothstep(2.5,5.,tr);
    float ring=floor(r/(R*.26));
    float id=floor((a+3.14159)/seg+.5)+ring*17.+step(R*.76, length(fp-vec2(R*.76,0.))+R*.57)*5.;
    float hh=h11(id*3.7+1.);
    vec3 g=hh<.35? vec3(.78,.06,.12) : hh<.6? vec3(.42,.08,.58) : hh<.85? vec3(.1,.2,.62) : vec3(1.,.64,.16);
    g*=.55+.45*vn(p/9.+t*.05);
    g*=1.65-r/R*.6;
    vec3 win=g*1.45*(.85+.15*sin(t*.7+r*.02));
    win=mix(win, vec3(1.,.95,.9)*1.7, smoothstep(R*.19,R*.1,r));
    col=mix(col, win, 1.-smoothstep(R-1.,R+1.,r));
    col=mix(col, vec3(.016,0.,.006), line);
  }
  col+=vec3(.95,.2,.28)*exp(-max(r-R,0.)/80.)*.28*step(R,r);
  vec2 sv=p-c;
  if(sv.y>0.){ float w=R*.55+sv.y*.32;
    float sh=exp(-pow(sv.x/w,2.))*exp(-sv.y/900.);
    float rays=.5+.5*fbm3(vec2(atan(sv.x,sv.y)*14., t*.08));
    col+=vec3(.8,.18,.3)*sh*rays*.2; }
  float sm=fbm(vec2(p.x/300.+t*.03, p.y/80.-t*.02));
  col+=vec3(.28,.05,.09)*sm*smoothstep(650.,1000.,p.y)*.55;
  if(p.y>905.){
    vec2 q=vec2(p.x, 2.*905.-p.y);
    vec2 rv=q-c; float rr=length(rv);
    col+=vec3(.9,.3,.4)*exp(-max(rr-R,0.)/120.)*.12*exp(-(p.y-905.)/80.);
    col=mix(col, col*.6+vec3(.02,0.,.01), .5);
  }
  return col;
}
// ── 6 starry hill / dawn
vec3 scStars(vec2 p, float t){
  float dawn=uP0.x, close=uP0.y, aur=uP0.z;
  float y=p.y/1080.;
  vec2 sp=par(p,.12);
  vec3 col=mix(vec3(.008,.014,.042), vec3(.03,.075,.15), smoothstep(.05,.85,sp.y/1080.));
  vec2 mw=sp-vec2(980.,380.);
  float ca=cos(-.42), sa=sin(-.42);
  mw=vec2(ca*mw.x-sa*mw.y, sa*mw.x+ca*mw.y);
  float band=exp(-pow(mw.y/(150.+40.*sin(mw.x/400.)),2.));
  float cl=fbm(mw/170.+2.);
  float dust=smoothstep(.45,.7,fbm(mw/75.+9.));
  vec3 mwc=mix(vec3(.18,.22,.5), vec3(.62,.48,.68), fbm(mw/50.));
  col+=mwc*band*cl*1.05*(1.-.75*dust*band);
  col+=vec3(.9,.8,.7)*pow(band,3.)*cl*cl*.25;
  float sd=1.+band*1.6;
  vec3 st=stars(sp,19.,.26*sd,1.,t)+stars(sp+vec2(211.,77.),47.,.55,1.5,t)+stars(sp+vec2(93.,151.),9.,.12*sd,.45,t);
  col+=st*(1.-close*.6);
  for(int i=0;i<2;i++){
    float fi=float(i), ph=fi*3.14159;
    float yc=300.+70.*sin(sp.x/310.+t*.12+ph)+30.*sin(sp.x/130.-t*.2+ph*1.3);
    float dy=sp.y-yc;
    float curtain=exp(-max(dy,0.)/16.)*exp(-max(-dy,0.)/150.);
    float streak=.5+.5*fbm3(vec2(sp.x/22.+t*.3*(fi*2.-1.), t*.1+fi*5.));
    float fold=.6+.4*sin(sp.x/60.+t*.5+fi*2.);
    vec3 ac=i==0? vec3(.38,.58,1.) : vec3(.36,1.,.68);
    col+=ac*curtain*streak*fold*.4*aur;
  }
  for(int i=0;i<4;i++){
    vec4 m=uMet[i]; float age=t-m.z;
    if(age>0. && age<1.3){
      vec2 dir=vec2(cos(m.w),sin(m.w));
      vec2 head=m.xy+dir*age*950.;
      float len=260.*min(age*3.,1.);
      vec2 v=sp-head; float al=-dot(v,dir); float pe=abs(v.x*dir.y-v.y*dir.x);
      float tail=step(0.,al)*smoothstep(len,0.,al)*exp(-pe*pe/2.5);
      float life=smoothstep(1.3,.65,age);
      col+=vec3(.85,.93,1.)*(tail*.9+exp(-dot(v,v)/10.)*2.)*life;
    }
  }
  vec3 dc=mix(vec3(.16,.2,.44), vec3(.62,.42,.6), smoothstep(.1,.55,y));
  dc=mix(dc, vec3(1.,.62,.46), smoothstep(.5,.72,y));
  dc=mix(dc, vec3(1.,.87,.64), smoothstep(.68,.78,y));
  vec2 sun=uP1.xy; float sd2=length(p-sun);
  dc+=vec3(1.,.72,.45)*exp(-sd2/400.)*.6 + vec3(1.,.9,.72)*exp(-sd2/80.)*.8;
  float dcl=fbm(vec2(sp.x/520.+t*.006, sp.y/90.));
  dc=mix(dc, mix(vec3(.55,.36,.55), vec3(1.,.72,.55), exp(-abs(sp.x-sun.x)/600.)), smoothstep(.55,.8,dcl)*smoothstep(.15,.3,y)*smoothstep(.62,.42,y)*.8);
  dc=mix(dc, vec3(1.,.96,.86)*2.5, smoothstep(40.,36.,sd2));
  col=mix(col, dc+st*.04, smoothstep(0.,1.,dawn));
  vec2 m1=par(p,.3); float hm=790.+55.*ridge(m1.x/380.,21.);
  vec3 mc=mix(vec3(.02,.035,.075), vec3(.45,.3,.42), dawn);
  col=mix(col, mc, cover(m1.y-hm));
  col+=mix(vec3(.05,.12,.2), vec3(1.,.6,.42), dawn)*exp(-abs(p.y-790.)/70.)*.3;
  if(close>0.){
    vec3 bok=vec3(0.);
    for(int i=0;i<2;i++){
      float cs=i==0?150.:240.;
      vec2 bq=p+vec2(t*(8.+float(i)*5.), 0.);
      vec2 g=floor(bq/cs), f=fract(bq/cs);
      vec2 c=.25+.5*h22(g+float(i)*31.);
      float r=(.25+.2*h12(g+7.))*cs*.5;
      float dd=length((f-c)*cs);
      float disc=smoothstep(r,r*.8,dd)*(.5+.5*smoothstep(r*.4,r,dd));
      vec3 kc=mix(vec3(.4,.6,1.), vec3(.45,1.,.7), step(.5,h12(g+2.)));
      bok+=kc*disc*step(.55,h12(g+40.))*(.5+.5*sin(t*.8+h12(g)*30.));
    }
    col=mix(col, col*.5+bok*.25, close);
  }
  return col;
}
void main(){
  vec2 f=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  vec2 p=(f-uView.xy)/uView.z;
  vec3 c;
  if(uScene==0) c=scPrologue(p,uT);
  else if(uScene==1) c=scDusk(p,uT);
  else if(uScene==2) c=scWalk(p,uT);
  else if(uScene==3) c=scStage(p,uT);
  else if(uScene==4) c=scRain(p,uT);
  else if(uScene==5) c=scMask(p,uT);
  else c=scStars(p,uT);
  o=vec4(c,1.);
}`;

// ---------------------------------------------------------------- 2D layer composite (rim light + reflection + emissive)
const FS_LAYER = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uL, uE; uniform vec2 uTx; uniform vec2 uLight;
uniform vec3 uAmb, uRim; uniform float uRimW, uOmni, uEmis, uReflY, uReflK, uRip, uT;
vec4 lit(vec2 uv){
  vec4 c=texture(uL,uv);
  if(c.a<.002) return vec4(0.);
  vec2 px=uv/uTx;
  vec2 dir=normalize(uLight-px+vec2(1e-3));
  float a1=texture(uL, uv+dir*uTx*uRimW).a, a2=texture(uL, uv+dir*uTx*uRimW*2.3).a;
  float dr=clamp(c.a-(a1*.6+a2*.4),0.,1.);
  float s=texture(uL,uv+vec2(uRimW,0.)*uTx).a+texture(uL,uv-vec2(uRimW,0.)*uTx).a+texture(uL,uv+vec2(0.,uRimW)*uTx).a+texture(uL,uv-vec2(0.,uRimW)*uTx).a;
  float om=clamp(c.a-s*.25,0.,1.);
  float rim=max(dr, om*uOmni);
  vec3 alb=c.rgb/c.a;
  float mx=max(max(alb.r,alb.g),max(alb.b,.05));
  vec3 tint=mix(vec3(1.), alb/mx, .55);
  float far=exp(-length(uLight-px)*uTx.y*.9);
  vec3 col=alb*uAmb*(1.+far*.25)+rim*uRim*tint*1.6;
  return vec4(col*c.a, c.a);
}
void main(){
  vec4 r=lit(vUv);
  vec2 px=vUv/uTx;
  if(uReflY>0. && px.y<uReflY){
    float dy=uReflY-px.y;
    vec2 ruv=vec2(px.x+sin(px.y*.21+uT*4.)*uRip, uReflY+dy*1.02)*uTx;
    vec4 rc=texture(uL, ruv);
    if(rc.a>.002){ vec3 alb=rc.rgb/rc.a; float k=uReflK*exp(-dy*uTx.y*5.);
      r=r+vec4(alb*uAmb*.8*rc.a*k, rc.a*k)*(1.-r.a); }
  }
  if(uEmis>0.){ vec4 e=texture(uE,vUv); r.rgb+=e.rgb*uEmis;
    if(uReflY>0. && px.y<uReflY){ float dy=uReflY-px.y; vec4 re=texture(uE, vec2(px.x, uReflY+dy)*uTx); r.rgb+=re.rgb*uEmis*uReflK*.5*exp(-dy*uTx.y*5.); } }
  o=r;
}`;

// ---------------------------------------------------------------- particles (GPU-driven)
const VS_PART = `#version 300 es

    sz=vec2(3.6, 22.); rot=-a;

// ---------------------------------------------------------------- flares (CPU-listed sprites)
const VS_FLARE = `#version 300 es
precision highp float;

  }
  const vis = [-VIEW.ox / VIEW.s, -VIEW.oy / VIEW.s, (R.W - VIEW.ox) / VIEW.s, (R.H - VIEW.oy) / VIEW.s];
  R.particles(Object.assign({ uT: tl, uVis: vis }, common), st.parts);
  R.flares(common, st.flares);
  R.blend(null);
  return st;
}

function post(src, gr, fb, fw, lens, T) {
  R.blend(null);
  R.target(R.h); R.use(R.pBright, { uS: { tex: src.t }, uTh: gr.th }); R.fs();
  R.target(R.q1); R.use(R.pBlur, { uS: { tex: R.h.t }, uD: [1 / R.h.w, 0] }); R.fs();
  R.target(R.q2); R.use(R.pBlur, { uS: { tex: R.q1.t }, uD: [0, 1 / R.q1.h] }); R.fs();
  R.target(R.e1); R.use(R.pBlur, { uS: { tex: R.q2.t }, uD: [1.5 / R.q2.w, 0] }); R.fs();
  R.target(R.e2); R.use(R.pBlur, { uS: { tex: R.e1.t }, uD: [0, 1.5 / R.e1.h] }); R.fs();
  R.target(R.e1); R.use(R.pBlur, { uS: { tex: R.e2.t }, uD: [2.2 / R.e2.w, 0] }); R.fs();
  R.target(R.e2); R.use(R.pBlur, { uS: { tex: R.e1.t }, uD: [0, 2.2 / R.e1.h] }); R.fs();
  R.target(null);
  R.use(R.pFinal, {
    uRes: [R.W, R.H], uView: [VIEW.ox, VIEW.oy, VIEW.s], uS: { tex: src.t }, uB1: { tex: R.q2.t }, uB2: { tex: R.e2.t }, uT: T,
    uBloom: gr.bloom, uExpo: gr.expo, uSat: gr.sat, uGamma: gr.gamma, uVig: gr.vig, uGrain: gr.grain, uFadeB: clamp(fb), uFadeW: clamp(fw),
    uCA: gr.ca, uLens: lens, uLeak: gr.leak, uBox: gr.box, uLift: gr.lift, uGain: gr.gain,
  });
  R.fs();
}

function renderAt(T, opt = {}) {
  if (!R) return;
  T = clamp(T, 0, DURATION);
  let tr = null; for (const x of TRANS) if (T >= x.at - x.dur / 2 && T < x.at + x.dur / 2) { tr = x; break; }
  let src, gr, fb, fw, lens;
  if (tr && tr.style === 'dissolve') {
    const A = sceneAt(tr.at - .001), B = sceneAt(tr.at + .001), k = ss(tr.at - tr.dur / 2, tr.at + tr.dur / 2, T);
    const sa = renderScene(A, T - A.t0, R.A), sb = renderScene(B, T - B.t0, R.B);
    R.target(R.M); R.blend(null); R.use(R.pMix, { uRes: [R.W, R.H], uA: { tex: R.A.t }, uB: { tex: R.B.t }, uK: k, uEdge: tr.edge }); R.fs();
    src = R.M; gr = lerpGrade(sa.grade, sb.grade, k); fb = lerp(sa.fadeB, sb.fadeB, k); fw = lerp(sa.fadeW, sb.fadeW, k); lens = lerp(sa.lens, sb.lens, k);
  } else {
    const sc = sceneAt(T), st = renderScene(sc, T - sc.t0, R.A);
    src = R.A; gr = st.grade; fb = st.fadeB; fw = st.fadeW; lens = st.lens;
    if (tr) { const a = T < tr.at ? ss(tr.at - tr.dur / 2, tr.at, T) : 1 - ss(tr.at, tr.at + tr.dur / 2, T); if (tr.style === 'black') fb = Math.max(fb, a); else fw = Math.max(fw, a); }
  }
  if (opt.poster) { gr = Object.assign({}, gr, { box: 0 }); fb = Math.max(fb, .25); }
  post(src, gr, fb, fw, lens, T);
  if (!opt.poster) updateText(T); else hideText();
}

// ---------------------------------------------------------------- text overlay
const subEls = SUBS.map(([t0, t1, who, text]) => { const d = document.createElement('div'); d.className = 'sub ' + who; d.textContent = text; $('subs').appendChild(d); return d; });
const cardEl = $('card'), titleEl = $('title'), creditEl = $('credit');
const fade = (T, t0, t1, a = .55, b = .7) => ss(t0, t0 + a, T) * (1 - ss(t1 - b, t1, T));
let lastCard = -1;
function setO(el, o) { const v = o < .003 ? 0 : o; if (el._o === v) return; el._o = v; el.style.opacity = v.toFixed(3); el.style.visibility = v ? 'visible' : 'hidden'; }
function updateText(T) {
  SUBS.forEach(([t0, t1], i) => { const o = fade(T, t0, t1); setO(subEls[i], o); if (o) subEls[i].style.transform = `translateY(calc(-50% + ${(1 - ss(t0, t0 + .8, T)) * 6}px))`; });
  let ci = -1, co = 0;
  CHAPTERS.forEach((c, i) => { const o = fade(T, c.t0, c.t1, 1, 1.1); if (o > co) { co = o; ci = i; } });
  if (ci !== lastCard && ci >= 0) { const c = CHAPTERS[ci]; cardEl.querySelector('.c-num').textContent = c.num; cardEl.querySelector('.c-title').textContent = c.title; cardEl.querySelector('.c-en').textContent = c.en; lastCard = ci; }
  setO(cardEl, co);
  if (ci >= 0) cardEl.style.setProperty('--sp', (1 - ss(CHAPTERS[ci].t0, CHAPTERS[ci].t0 + 3, T)).toFixed(3));
  let to = 0, end = false; for (const x of TITLES) { const o = fade(T, x.t0, x.t1, 1.6, 1.4); if (o > to) { to = o; end = !!x.end; } }
  setO(titleEl, to); titleEl.classList.toggle('end', end);
  if (to) titleEl.style.setProperty('--sp', (1 - ss(end ? 233.2 : 6.6, (end ? 233.2 : 6.6) + 5, T)).toFixed(3));
  setO(creditEl, fade(T, 235.2, 239.4, 1.2, 1.2));
}
function hideText() { subEls.forEach(e => setO(e, 0)); setO(cardEl, 0); setO(titleEl, 0); setO(creditEl, 0); }

// ---------------------------------------------------------------- clock + transport
const clock = { playing: false, pos: 0, t0: 0, sync: false };
function now() {
  if (!clock.playing) return clock.pos;
  if (engine && clock.sync) return engine.songTime();
  return clock.pos + (performance.now() - clock.t0) / 1000;
}
async function play() {
  if (clock.pos >= DURATION - .05) clock.pos = 0;
  clock.playing = true; clock.t0 = performance.now(); clock.sync = false; updateUI();
  if (engine) {
    try { await engine.ctx.resume(); } catch (e) { }
    if (!clock.playing) return;
    clock.pos = now(); clock.t0 = performance.now();
    engine.startAt(clock.pos); clock.sync = true;
  }
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { }
}
function pause() {
  clock.pos = now(); clock.playing = false; clock.sync = false;
  if (engine) { engine.stopAll(); engine.ctx.suspend().catch(() => { }); }
  updateUI();
}
function seek(t) {
  t = clamp(t, 0, DURATION); clock.pos = t;
  if (clock.playing) { clock.t0 = performance.now(); if (engine && clock.sync) engine.startAt(t); }
  if (!clock.playing) renderAt(t);
  updateUI();
}
const fmt = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

// ---------------------------------------------------------------- UI wiring
const ui = $('ui'), track = $('track'), fill = track.querySelector('.track-fill'), knob = track.querySelector('.track-knob');
const marks = track.querySelector('.track-marks');
[{ at: 0, title: '序' }].concat(CHAPTERS.map(c => ({ at: c.at, title: c.num + ' · ' + c.title }))).forEach(c => {
  const m = document.createElement('button'); m.className = 'mark'; m.style.left = (c.at / DURATION * 100) + '%'; m.title = c.title; m.setAttribute('aria-label', '跳到 ' + c.title);
  m.addEventListener('click', ev => { ev.stopPropagation(); seek(c.at + .01); poke(); });
  const lab = document.createElement('span'); lab.textContent = c.title; m.appendChild(lab); marks.appendChild(m);
});
function updateUI() {
  const T = now();
  $('t-cur').textContent = fmt(T);
  const p = T / DURATION * 100; fill.style.width = p + '%'; knob.style.left = p + '%';
  track.setAttribute('aria-valuenow', Math.round(T)); track.setAttribute('aria-valuetext', fmt(T) + ' / 4:00');
  $('b-play').classList.toggle('is-playing', clock.playing); $('b-play').setAttribute('aria-label', clock.playing ? '暂停' : '播放');
}
let hideTimer = 0;
function poke() { ui.classList.remove('hide'); document.body.classList.remove('nocursor'); clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (clock.playing && !ui.matches(':hover') && !ui.querySelector(':focus-visible')) { ui.classList.add('hide'); document.body.classList.add('nocursor'); } }, 2600); }
window.addEventListener('pointermove', poke); window.addEventListener('pointerdown', poke);
$('b-play').addEventListener('click', () => { clock.playing ? pause() : play(); poke(); });
let tapRevealed = false;
$('stage-hit').addEventListener('pointerdown', () => { tapRevealed = ui.classList.contains('hide'); });
$('stage-hit').addEventListener('click', () => { if (!started) return; if (!tapRevealed) clock.playing ? pause() : play(); tapRevealed = false; poke(); });
let muted = false;
$('b-mute').addEventListener('click', () => { muted = !muted; if (engine) engine.setVolume(muted ? 0 : 1); $('b-mute').classList.toggle('is-muted', muted); $('b-mute').setAttribute('aria-label', muted ? '取消静音' : '静音'); poke(); });
$('b-full').addEventListener('click', () => { const d = document; if (d.fullscreenElement) d.exitFullscreen().catch(() => { }); else (d.documentElement.requestFullscreen ? d.documentElement.requestFullscreen() : Promise.reject()).catch(() => { }); poke(); });
let dragging = false;
const seekFromEvent = ev => { const r = track.getBoundingClientRect(); seek((ev.clientX - r.left) / r.width * DURATION); };
track.addEventListener('pointerdown', ev => { dragging = true; track.setPointerCapture(ev.pointerId); seekFromEvent(ev); });
track.addEventListener('pointermove', ev => { if (dragging) seekFromEvent(ev); });
track.addEventListener('pointerup', () => { dragging = false; });
track.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight') { seek(now() + 5); ev.preventDefault(); } if (ev.key === 'ArrowLeft') { seek(now() - 5); ev.preventDefault(); } });
window.addEventListener('keydown', ev => {
  if (!started || ev.target.closest && ev.target.closest('#track')) return;
  if (ev.key === ' ' || ev.key === 'k') { ev.preventDefault(); clock.playing ? pause() : play(); }
  else if (ev.key === 'ArrowRight') seek(now() + 5); else if (ev.key === 'ArrowLeft') seek(now() - 5);
  else if (ev.key === 'f') $('b-full').click(); else if (ev.key === 'm') $('b-mute').click();
  poke();
});
window.addEventListener('resize', () => { layout(); if (!clock.playing) renderAt(started ? now() : 205.5, { poster: !started }); });

$('play-btn').addEventListener('click', async () => {
  if (started || !R) return;
  const btn = $('play-btn'), lab = btn.querySelector('span');
  btn.disabled = true; lab.textContent = '调音中…';
  try {
    engine = new Engine(buildScore());
    await engine.prepare(p => { lab.textContent = '调音中 ' + Math.round(p * 100) + '%'; });
  } catch (e) { console.warn('audio unavailable', e); engine = null; }
  started = true;
  document.body.classList.add('started');
  $('start').hidden = true;
  clock.pos = 0; play(); poke();
});

// ---------------------------------------------------------------- loop
let lastF = performance.now(), slow = 0, fast = 0;
function frame() {
  const t0 = performance.now(), dt = t0 - lastF; lastF = t0;
  if (started) {
    if (engine && clock.playing && clock.sync) engine.tick();
    let T = now();
    if (T >= DURATION) { clock.pos = DURATION; clock.playing = false; clock.sync = false; T = DURATION; ui.classList.remove('hide'); updateUI(); }
    renderAt(T);
    if (clock.playing) updateUI();
    if (dt > 34) slow++; else slow = Math.max(0, slow - 1);
    if (slow > 50 && quality > .56) { quality *= .86; slow = 0; layout(); }
  }
  requestAnimationFrame(frame);
}
setInterval(() => { if (engine && clock.playing && clock.sync) engine.tick(); }, 60);

layout();
if (R) {
  if (TEST) {
    started = true; $('start').hidden = true; ui.hidden = true;
    window.__render = (t, poster) => { renderAt(t, { poster }); return true; };
    window.__audio = { Engine, buildScore };
    const t = parseFloat(QS.get('t') || '0'); clock.pos = t; renderAt(t);
  } else {
    renderAt(205.5, { poster: true });
    requestAnimationFrame(frame);
  }
}
updateUI();

})();
</script>
